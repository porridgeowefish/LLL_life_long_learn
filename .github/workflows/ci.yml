# LLL continuous integration. Runs the repository quality gate on Windows
# (the product's first-class platform) without provider credentials or
# native-CLI smoke — those stay local delivery checks recorded in the
# iteration delivery notes.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      # Automated suites are local-only since v0.5.0, so CI runs the fast gate
      # (format, vet, build, architecture, published tests, lint) plus a
      # production frontend build. Maintainers run check:full locally.
      - name: Repository quality gate (fast)
        run: npm run check:fast

      - name: Frontend production build
        run: npm --prefix frontend run build

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          path: .artifacts/quality/
          if-no-files-found: ignore
          retention-days: 7
