<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>创建智能体 · LLL</title>
<link rel="stylesheet" href="css/base.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:wght@700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
.ca-page{padding:32px 48px 100px;max-width:820px;margin:0 auto}
.ca-page h1{font-family:var(--font-serif);font-size:1.7rem;font-weight:900;margin-bottom:4px}
.ca-page .lede{color:var(--muted-2);font-size:.88rem;margin-bottom:26px}

.field{margin-bottom:22px}
.field-label{display:flex;align-items:center;gap:8px;font-size:.82rem;font-weight:600;margin-bottom:8px}
.field-label .req{color:var(--orange);font-size:.7rem}
.field-hint{font-size:.7rem;color:var(--muted);margin-top:5px;line-height:1.5}

.ca-input{
  width:100%;padding:11px 14px;font-size:.95rem;
  border:1px solid var(--border);border-radius:8px;background:var(--card);
}
.ca-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.ca-textarea{
  width:100%;padding:11px 14px;font-size:.9rem;
  border:1px solid var(--border);border-radius:8px;background:var(--card);
  min-height:80px;max-height:160px;resize:vertical;font-family:inherit;
}
.ca-textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* 模板卡片大 grid（核心抓手） */
.tpl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:8px}
.tpl-card{
  display:flex;flex-direction:column;gap:8px;
  padding:16px 18px;background:var(--card);border:2px solid var(--border);
  border-radius:10px;cursor:pointer;transition:all .12s;position:relative;
}
.tpl-card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.tpl-card input{display:none}
.tpl-card.selected{border-color:var(--accent);background:var(--accent-soft)}
.tpl-card .ico{font-size:1.8rem}
.tpl-card .name{font-size:.92rem;font-weight:700}
.tpl-card .desc{font-size:.7rem;color:var(--muted-2);line-height:1.55}
.tpl-card .zones{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}
.tpl-card .zones .tag{font-size:.6rem;padding:1px 6px}
.tpl-card .badge-fork{
  position:absolute;top:10px;right:10px;font-size:.6rem;
  color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:8px;font-weight:600;
}

/* emoji picker 简化 */
.emoji-row{display:flex;flex-wrap:wrap;gap:4px;padding:10px;background:var(--card);border:1px solid var(--border);border-radius:8px}
.emoji-row button{
  width:34px;height:34px;font-size:1.2rem;border-radius:5px;
  display:inline-flex;align-items:center;justify-content:center;background:transparent;
}
.emoji-row button:hover{background:var(--accent-soft)}
.emoji-row button.selected{background:var(--accent);box-shadow:0 0 0 2px var(--accent)}

/* 阶段多选 */
.zone-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.zone-grid label{
  padding:10px 8px;background:var(--card);border:2px solid var(--border);
  border-radius:6px;cursor:pointer;text-align:center;
  font-size:.74rem;transition:all .12s;
}
.zone-grid input{display:none}
.zone-grid label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}

/* tab：模板 vs 自定义 */
.ca-tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--border)}
.ca-tab{
  padding:10px 18px;font-size:.82rem;font-weight:600;color:var(--muted);
  border-bottom:2px solid transparent;cursor:pointer;
}
.ca-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.ca-section{display:none}
.ca-section.active{display:block}

/* 吸底大按钮 */
.ca-submit{
  display:flex;justify-content:space-between;align-items:center;
  position:sticky;bottom:0;left:0;right:0;
  background:var(--card);border-top:1px solid var(--border);
  padding:14px 48px;margin:30px -48px -100px;
  box-shadow:0 -2px 12px rgba(61,50,41,.06);
}
.ca-submit .summary{font-size:.78rem;color:var(--muted-2);line-height:1.5}
.ca-actions{display:flex;gap:8px}
.ca-btn{
  padding:13px 30px;border-radius:8px;font-size:.92rem;font-weight:700;
  text-decoration:none;transition:all .15s;
}
.ca-btn.primary{background:var(--orange);color:#fff;box-shadow:0 6px 18px rgba(232,148,90,.35)}
.ca-btn.primary:hover{background:#d4824a;color:#fff;transform:translateY(-1px);text-decoration:none}
.ca-btn.ghost{background:transparent;color:var(--muted)}
.ca-btn.ghost:hover{color:var(--fg);text-decoration:none}
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="topbar-logo">Life<span class="accent">Long</span>Learn</a>
  <div class="topbar-sep"></div>
  <div class="topbar-nav">
    <a href="index.html">总览</a>
    <a href="project.html">项目</a>
    <a href="agents.html" class="active">智能体</a>
    <a href="memory.html">记忆</a>
  </div>
  <div class="topbar-spacer"></div>
  <div class="topbar-actions">
    <div class="topbar-status">
      <span><span class="dot"></span>本地在线</span>
      <span class="path">D:\2_Study\LLL\agents\charters\</span>
    </div>
  </div>
</div>

<main class="main">
  <div class="ca-page">

    <h1>创建智能体</h1>
    <p class="lede">两种方式：①一键 fork 内置模板稍作修改；②从零自定义。**fork 优先**。</p>

    <!-- 模式切换 -->
    <div class="ca-tabs">
      <div class="ca-tab active" data-mode="fork">从模板 Fork（推荐）</div>
      <div class="ca-tab" data-mode="custom">从零自定义</div>
    </div>

    <!-- ====== Fork 模式（默认显示） ====== -->
    <div class="ca-section active" data-mode="fork">

      <div class="field">
        <label class="field-label">挑一个内置模板作为起点</label>
        <div class="tpl-grid">

          <label class="tpl-card selected">
            <input type="radio" name="tpl" value="intro" checked>
            <div class="badge-fork">已选</div>
            <div class="ico">🌱</div>
            <div class="name">引入智能体</div>
            <div class="desc">建立兴趣 + 入门问题 + 激活先验</div>
            <div class="zones"><span class="tag">引入</span></div>
          </label>

          <label class="tpl-card">
            <input type="radio" name="tpl" value="explain">
            <div class="ico">📖</div>
            <div class="name">讲解智能体</div>
            <div class="desc">深度思考分解 + 概念图 + MECE</div>
            <div class="zones"><span class="tag">讲解</span></div>
          </label>

          <label class="tpl-card">
            <input type="radio" name="tpl" value="practice">
            <div class="ico">✏️</div>
            <div class="name">练习智能体</div>
            <div class="desc">设计任务 + 约束 + 评审，不给答案</div>
            <div class="zones"><span class="tag">练习</span></div>
          </label>

          <label class="tpl-card">
            <input type="radio" name="tpl" value="extend">
            <div class="ico">🔗</div>
            <div class="name">拓展智能体</div>
            <div class="desc">关系梳理 + 高阶问题 + 不给结论</div>
            <div class="zones"><span class="tag">拓展</span></div>
          </label>

          <label class="tpl-card">
            <input type="radio" name="tpl" value="summary">
            <div class="ico">📝</div>
            <div class="name">总结智能体</div>
            <div class="desc">整理输出 + 学习者主权 + 不覆盖</div>
            <div class="zones"><span class="tag">总结</span></div>
          </label>

          <label class="tpl-card">
            <input type="radio" name="tpl" value="memory">
            <div class="ico">🧠</div>
            <div class="name">记忆智能体（全阶段）</div>
            <div class="desc">更新学习者档案 + 项目记忆</div>
            <div class="zones"><span class="tag">全阶段</span></div>
          </label>

        </div>
        <div class="field-hint">Fork 后可以基于模板稍作修改，不用从零写章程</div>
      </div>

      <div class="field">
        <label class="field-label">名称（你的变体叫什么）<span class="req">*必填</span></label>
        <input type="text" class="ca-input" value="引入智能体 · 我的变体" id="nameInput">
      </div>

      <div class="field">
        <label class="field-label">差异说明（一句话告诉系统这个变体和模板的区别）</label>
        <input type="text" class="ca-input" placeholder="例如：更激进，5 秒进入主题，跳过动机铺垫">
      </div>

    </div>

    <!-- ====== 自定义模式 ====== -->
    <div class="ca-section" data-mode="custom">

      <div class="field">
        <label class="field-label">名称 <span class="req">*必填</span></label>
        <input type="text" class="ca-input" placeholder="例如：修复教练" id="customName">
      </div>

      <div class="field">
        <label class="field-label">图标</label>
        <div class="emoji-row">
          <button>🌱</button><button>📖</button><button>✏️</button><button>🔗</button>
          <button>📝</button><button>🧠</button><button class="selected">🔧</button><button>🎯</button>
          <button>🔍</button><button>📊</button><button>📐</button><button>🎨</button>
          <button>🚨</button><button>⚗️</button><button>🧪</button><button>🛠</button>
        </div>
      </div>

      <div class="field">
        <label class="field-label">类型</label>
        <select class="ca-input">
          <option>约束设计（设计任务和约束，不给答案）</option>
          <option>结构化输出（讲解/概念图/对比表）</option>
          <option>审阅/反馈（评审学习者的产出）</option>
          <option>记忆/索引（更新记忆或文件索引）</option>
          <option>开放对话（自由问答）</option>
        </select>
      </div>

      <div class="field">
        <label class="field-label">允许阶段（多选）</label>
        <div class="zone-grid">
          <label><input type="checkbox">🌱 引入</label>
          <label><input type="checkbox">📖 讲解</label>
          <label><input type="checkbox" checked>✏️ 练习</label>
          <label><input type="checkbox">🔗 拓展</label>
          <label><input type="checkbox">📝 总结</label>
          <label><input type="checkbox">全阶段</label>
        </div>
      </div>

      <div class="field">
        <label class="field-label">章程（一段话讲清角色边界）</label>
        <textarea class="ca-textarea" placeholder="例如：专注于修复 bug 模式的练习设计。给有 bug 代码，让学习者定位和修复。绝不直接给答案。">专注于修复 bug 模式的练习设计。给有 bug 代码，让学习者定位和修复。绝不直接给答案。</textarea>
        <div class="field-hint">一段话即可，不要长篇大论。后续可以编辑。</div>
      </div>

    </div>

    <!-- 吸底提交（两个模式共享） -->
    <div class="ca-submit">
      <div class="summary">
        注册到 <strong>agents/charters/&lt;slug&gt;.md</strong>
      </div>
      <div class="ca-actions">
        <a href="agents.html" class="ca-btn ghost">取消</a>
        <a href="agents.html" class="ca-btn primary">创建智能体 →</a>
      </div>
    </div>

  </div>
</main>

<script>
(function(){
  // tab 切换
  document.querySelectorAll('.ca-tab').forEach(function(t){
    t.addEventListener('click', function(){
      var mode = t.dataset.mode;
      document.querySelectorAll('.ca-tab').forEach(function(x){x.classList.toggle('active', x.dataset.mode === mode)});
      document.querySelectorAll('.ca-section').forEach(function(s){s.classList.toggle('active', s.dataset.mode === mode)});
    });
  });

  // 模板选择
  document.querySelectorAll('.tpl-card').forEach(function(c){
    c.addEventListener('click', function(){
      document.querySelectorAll('.tpl-card').forEach(function(x){
        x.classList.remove('selected');
        var b = x.querySelector('.badge-fork'); if(b) b.remove();
      });
      c.classList.add('selected');
      if(!c.querySelector('.badge-fork')){
        var b = document.createElement('div');
        b.className = 'badge-fork'; b.textContent = '已选';
        c.appendChild(b);
      }
    });
  });

  // emoji picker
  document.querySelectorAll('.emoji-row button').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('.emoji-row button').forEach(function(x){x.classList.remove('selected')});
      b.classList.add('selected');
    });
  });
})();
</script>

</body>
</html>
