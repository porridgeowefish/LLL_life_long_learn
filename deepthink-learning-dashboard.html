<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=http://localhost:8787/">
  <title>DeepThink Claude Orchestrator</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f6fa;
      color: #172033;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
    }
    main {
      width: min(560px, calc(100vw - 32px));
      background: #fff;
      border: 1px solid #dbe2ee;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 14px 34px rgba(23, 32, 51, .08);
    }
    h1 { margin: 0 0 10px; font-size: 22px; }
    p { color: #667186; line-height: 1.6; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 14px;
      border-radius: 8px;
      background: #2563b8;
      color: #fff;
      text-decoration: none;
    }
    code {
      background: #eef2f7;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <main>
    <h1>DeepThink 已升级为前后端系统</h1>
    <p>请通过本地服务访问控制台。如果没有自动跳转，在 <code>D:\2_Study\LLL</code> 下执行 <code>npm start</code>。</p>
    <a href="http://localhost:8787/">打开 Claude Code 学习编排器</a>
  </main>
</body>
</html>
