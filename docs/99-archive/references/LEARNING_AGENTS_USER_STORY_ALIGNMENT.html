<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLL 五智能体用户故事补充对齐稿</title>
  <style>
    :root {
      --paper: #f4efe5;
      --paper-deep: #e7dcc9;
      --ink: #17211d;
      --muted: #667168;
      --line: #d2c4ae;
      --card: rgba(255, 253, 247, .88);
      --forest: #1f5a47;
      --forest-soft: #dcebe4;
      --rust: #b84d2f;
      --rust-soft: #f4ddd4;
      --gold: #b47b20;
      --gold-soft: #f5e8c9;
      --blue: #2d6383;
      --blue-soft: #dceaf2;
      --danger: #9a3f3f;
      --shadow: 0 18px 50px rgba(55, 45, 31, .12);
      --serif: "Iowan Old Style", "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
      --sans: "Aptos", "Noto Sans SC", "Source Han Sans SC", sans-serif;
      --mono: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--sans);
      background:
        radial-gradient(circle at 8% 4%, rgba(184, 77, 47, .14), transparent 28rem),
        radial-gradient(circle at 96% 92%, rgba(31, 90, 71, .16), transparent 30rem),
        repeating-linear-gradient(0deg, rgba(83, 68, 45, .025) 0, rgba(83, 68, 45, .025) 1px, transparent 1px, transparent 24px),
        var(--paper);
    }

    button,
    textarea,
    input,
    select { font: inherit; }

    button { color: inherit; }

    .app {
      display: grid;
      grid-template-columns: 310px minmax(0, 1fr);
      min-height: 100vh;
    }

    .rail {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      padding: 26px 20px;
      border-right: 1px solid var(--line);
      background: rgba(247, 242, 232, .92);
      backdrop-filter: blur(14px);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--rust);
      font: 800 11px/1 var(--sans);
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .rail h1 {
      margin: 0;
      font: 900 28px/1.08 var(--serif);
    }

    .rail-copy {
      margin: 12px 0 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .summary-box {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .summary-box div {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.58);
    }

    .summary-box strong {
      display: block;
      font: 800 20px/1 var(--serif);
    }

    .summary-box span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    .progress-track {
      height: 7px;
      margin-bottom: 20px;
      overflow: hidden;
      border-radius: 999px;
      background: #ded5c5;
    }

    .progress-track span {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--rust), var(--gold), var(--forest));
      transition: width .25s ease;
    }

    .page-nav {
      display: grid;
      gap: 7px;
    }

    .page-link {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid transparent;
      border-radius: 13px;
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: .18s ease;
    }

    .page-link:hover,
    .page-link.active {
      border-color: var(--line);
      background: rgba(255,255,255,.72);
      box-shadow: 0 8px 22px rgba(55,45,31,.08);
      transform: translateX(3px);
    }

    .page-link small {
      display: block;
      color: var(--rust);
      font: 800 10px/1 var(--sans);
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .page-link strong {
      display: block;
      margin-top: 5px;
      font-size: 14px;
    }

    .page-link span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .rail-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 20px;
    }

    .rail-actions .wide { grid-column: 1 / -1; }

    .btn {
      min-height: 39px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: rgba(255,255,255,.68);
      cursor: pointer;
      transition: .16s ease;
    }

    .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(55,45,31,.09); }
    .btn.primary { border-color: var(--forest); background: var(--forest); color: #fff; }
    .btn.rust { border-color: var(--rust); background: var(--rust); color: #fff; }
    .btn.ghost { background: transparent; }
    .btn:disabled { cursor: not-allowed; opacity: .45; transform: none; box-shadow: none; }

    .main {
      min-width: 0;
      padding: 24px 28px 30px;
    }

    .toolbar {
      position: sticky;
      top: 14px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      max-width: 1280px;
      margin: 0 auto 18px;
      padding: 14px 17px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(250,247,239,.88);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .toolbar-title strong {
      display: block;
      font: 800 18px/1.2 var(--serif);
    }

    .toolbar-title span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .toolbar-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .toolbar input,
    .toolbar select {
      min-height: 39px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: rgba(255,255,255,.76);
      padding: 0 11px;
    }

    .toolbar input { width: 210px; }

    .page {
      display: none;
      max-width: 1280px;
      min-height: calc(100vh - 130px);
      margin: 0 auto;
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(255,252,246,.76);
      box-shadow: var(--shadow);
    }

    .page.active { display: block; animation: reveal .24s ease both; }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .page-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: start;
      margin-bottom: 22px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }

    .page-head h2 {
      margin: 0;
      font: 900 clamp(28px, 4vw, 44px)/1.05 var(--serif);
    }

    .page-head p {
      max-width: 850px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
    }

    .page-number {
      min-width: 92px;
      padding: 12px 14px;
      border-radius: 16px;
      background: var(--ink);
      color: #fff;
      text-align: center;
    }

    .page-number small {
      display: block;
      color: #c9d3cd;
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .page-number strong {
      display: block;
      margin-top: 5px;
      font: 800 25px/1 var(--serif);
    }

    .callout {
      margin-bottom: 18px;
      padding: 15px 17px;
      border: 1px solid #dec78d;
      border-left: 5px solid var(--gold);
      border-radius: 14px;
      background: var(--gold-soft);
      line-height: 1.65;
      font-size: 13px;
    }

    .story-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    .story-card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
    }

    .story-card[data-status="accept"] { border-color: #8eb49f; box-shadow: inset 0 4px 0 var(--forest); }
    .story-card[data-status="revise"] { border-color: #d5ad61; box-shadow: inset 0 4px 0 var(--gold); }
    .story-card[data-status="reject"] { border-color: #cb8c8c; box-shadow: inset 0 4px 0 var(--danger); }
    .story-card[data-status="pending"] { box-shadow: inset 0 4px 0 #9aa39d; }

    .story-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .story-id {
      display: inline-flex;
      min-height: 25px;
      align-items: center;
      padding: 0 9px;
      border-radius: 999px;
      background: var(--rust-soft);
      color: var(--rust);
      font: 800 11px/1 var(--mono);
    }

    .consensus {
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--forest-soft);
      color: var(--forest);
      font-size: 10px;
      font-weight: 800;
    }

    .story-card h3 {
      margin: 13px 0 8px;
      font: 800 21px/1.18 var(--serif);
    }

    .story-summary {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .story-statement {
      margin: 14px 0 0;
      padding: 12px 13px;
      border-radius: 12px;
      background: #f3eee4;
      font-size: 13px;
      line-height: 1.65;
    }

    .detail {
      margin-top: 13px;
      border-top: 1px dashed var(--line);
      padding-top: 12px;
    }

    .detail summary {
      cursor: pointer;
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
    }

    .detail h4 {
      margin: 13px 0 5px;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .detail ul {
      margin: 0;
      padding-left: 19px;
      font-size: 12px;
      line-height: 1.7;
    }

    .action-table {
      width: 100%;
      margin-top: 8px;
      border-collapse: collapse;
      font-size: 11px;
    }

    .action-table th,
    .action-table td {
      padding: 7px 8px;
      border: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      line-height: 1.5;
    }

    .action-table th { background: var(--paper-deep); }

    .source {
      margin-top: 12px;
      color: #7a6e5f;
      font: 10px/1.55 var(--mono);
      overflow-wrap: anywhere;
    }

    .decision {
      margin-top: auto;
      padding-top: 16px;
    }

    .status-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    .status-row label {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }

    .status-row input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .status-row label:has(input:checked) {
      border-color: var(--ink);
      background: var(--ink);
      color: #fff;
    }

    .feedback {
      width: 100%;
      min-height: 72px;
      margin-top: 8px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,.8);
      padding: 10px 11px;
      color: var(--ink);
      font-size: 12px;
      line-height: 1.55;
    }

    .feedback:focus,
    .toolbar input:focus,
    .toolbar select:focus {
      outline: 2px solid rgba(45,99,131,.22);
      border-color: var(--blue);
    }

    .package {
      display: grid;
      gap: 14px;
    }

    .package textarea {
      width: 100%;
      min-height: 420px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #1e2421;
      color: #eef5ef;
      padding: 18px;
      font: 12px/1.65 var(--mono);
    }

    .package-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 32px;
      border: 1px dashed var(--line);
      border-radius: 18px;
      color: var(--muted);
      text-align: center;
    }

    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 80;
      max-width: 360px;
      padding: 12px 15px;
      border-radius: 12px;
      background: var(--ink);
      color: #fff;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: .2s ease;
      font-size: 12px;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    .file-input { display: none; }

    @media (max-width: 1080px) {
      .app { grid-template-columns: 250px minmax(0, 1fr); }
      .story-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 760px) {
      .app { display: block; }
      .rail { position: static; width: 100%; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      .page-nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .main { padding: 14px; }
      .toolbar { position: static; align-items: flex-start; flex-direction: column; }
      .toolbar-controls { justify-content: flex-start; }
      .toolbar input { width: min(100%, 280px); }
      .page { padding: 20px; }
      .page-head { grid-template-columns: 1fr; }
      .page-number { width: 92px; }
      .status-row { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail">
      <p class="eyebrow">LLL Product Alignment</p>
      <h1>五智能体用户故事补充稿</h1>
      <p class="rail-copy">
        这不是实现页面，而是实现前的合同桌。逐项选择“认同 / 需修改 / 不采用 / 待决定”，写下反馈，然后下载一份自带结果的 HTML。
      </p>

      <div class="summary-box">
        <div><strong id="acceptedCount">0</strong><span>已认同</span></div>
        <div><strong id="reviewedCount">0</strong><span>已表态</span></div>
        <div><strong id="feedbackCount">0</strong><span>有反馈</span></div>
        <div><strong id="totalCount">0</strong><span>故事总数</span></div>
      </div>
      <div class="progress-track" aria-label="对齐进度"><span id="progressBar"></span></div>

      <nav class="page-nav" id="pageNav"></nav>

      <div class="rail-actions">
        <button class="btn ghost" id="prevBtn">上一页</button>
        <button class="btn primary" id="nextBtn">下一页</button>
        <button class="btn rust wide" id="exportHtmlBtn">下载已对齐 HTML</button>
        <button class="btn wide" id="jumpPackageBtn">查看 AI 补充包</button>
      </div>
    </aside>

    <main class="main">
      <section class="toolbar">
        <div class="toolbar-title">
          <strong id="toolbarTitle"></strong>
          <span id="toolbarDesc"></span>
        </div>
        <div class="toolbar-controls">
          <input id="searchInput" type="search" placeholder="搜索故事、按钮、数据路径">
          <select id="statusFilter" aria-label="按状态筛选">
            <option value="all">全部状态</option>
            <option value="accept">只看认同</option>
            <option value="revise">只看需修改</option>
            <option value="reject">只看不采用</option>
            <option value="pending">只看待决定</option>
          </select>
          <button class="btn" id="exportJsonBtn">导出 JSON</button>
          <button class="btn" id="importBtn">导入结果</button>
          <input class="file-input" id="importFile" type="file" accept=".json,application/json">
          <button class="btn ghost" id="resetBtn">恢复初始</button>
        </div>
      </section>

      <section id="deck"></section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script id="alignment-seed">window.__LLL_ALIGNMENT_SEED__ = null;</script>
  <script>
    const STORAGE_KEY = "lll-learning-agents-alignment-v1";
    const STATUS_LABELS = {
      accept: "认同",
      revise: "需修改",
      reject: "不采用",
      pending: "待决定"
    };

    const pages = [
      {
        id: "guide",
        short: "使用说明",
        title: "先把事实、共识和原型猜测分开",
        desc: "用户本轮明确认可的内容默认标为“认同”；v3 额外出现但尚未确认的能力默认标为“待决定”。",
        callout: "边界说明：当前 iteration-02 只承诺工作台骨架与 Explain Agent。本文面向后续产品补充，不自动扩大当前迭代的实现范围。",
        items: [
          {
            id: "G-01",
            title: "五个学习智能体是固定主流程",
            summary: "项目内保留 Intro / Explain / Practice / Extend（领域）/ Summary 五个阶段；阶段之间共享学习痕迹，但职责不互相吞并。",
            story: "作为学习者，我希望每个学习项目都有稳定的五阶段骨架，以便我知道现在是在激发兴趣、理解、练习、建立关系，还是沉淀复习材料。",
            acceptance: [
              "五阶段在项目导航中固定可见。",
              "可以跳转，但系统明确展示前置材料是否齐全。",
              "每个阶段有独立输入、产出、动作和持久化合同。",
              "Memory Agent 不作为第六个学习阶段；若保留，只能是横切辅助能力。"
            ],
            data: ["project state.active_zone", "各 zone 的输出与学习痕迹", "跨阶段 artifact 引用"],
            source: "用户本轮 1-5；LEARNING_PROJECT_STRUCTURE.md § Learning Flow Zones",
            consensus: true
          },
          {
            id: "G-02",
            title: "原型不是产品合同",
            summary: "v3 中出现的按钮、默认值和布局只能作为候选；只有在本页被认同后，才进入后续用户故事与迭代文档。",
            story: "作为产品维护者，我希望实验 mock 中的所有暗示都被显式审查，以免开发团队把演示文本误当成已经确认的需求。",
            acceptance: [
              "每个交互动作都能在本文找到目的、前置条件、成功结果和失败结果。",
              "缺失页面或假链接被标为缺口，而不是假装可用。",
              "用户导出的 HTML 成为下一轮补充输入，不直接替代正式 PRD/iteration 文档。"
            ],
            data: ["alignment decision", "feedback", "exportedAt"],
            source: "frontend-designs/v3/*；DOCUMENTATION_STANDARD 的事实源原则",
            consensus: true
          },
          {
            id: "G-03",
            title: "选择结果必须可被下一轮 AI 读取",
            summary: "对齐结果既保存在浏览器本地，也能下载为一份包含选择与反馈的独立 HTML。",
            story: "作为产品负责人，我希望完成选择后直接把同一份 HTML 交给 AI，使 AI 只读取我认同或要求修改的故事，再继续补充正式产品文档。",
            acceptance: [
              "输入变化自动保存到 localStorage。",
              "“下载已对齐 HTML”生成可离线打开的单文件。",
              "导出的 HTML 内嵌当前状态，不依赖原浏览器缓存。",
              "AI 补充包只列认同与需修改项，并保留反馈。"
            ],
            actions: [
              ["下载已对齐 HTML", "序列化当前页面与全部选择，生成单文件下载", "下载成功；原文件不被浏览器静默覆盖"],
              ["导出 JSON", "生成机器可读备份", "包含 schemaVersion、时间、逐项状态和反馈"],
              ["导入结果", "读取此前 JSON 并覆盖当前对齐状态", "先校验结构；无效文件不改变现状"],
              ["恢复初始", "回到本文预置共识", "需要二次确认，清除本页 localStorage"]
            ],
            source: "用户本轮：可以选择和反馈，并且可以保存结果在 HTML 中",
            consensus: true
          }
        ]
      },
      {
        id: "input",
        short: "学习输入",
        title: "项目入口只收真正影响学习编排的四项",
        desc: "主题已由当前项目确定；Intro 的最小输入聚焦学习起点、目标、难度与交付成果。",
        callout: "与 v3 的差异：分类、模板、起点阶段、备注可以作为高级设置，但不能挤进最小必填表单。v3 的“仅主题必填”也不足以支撑用户明确要求的四项学习合同。",
        items: [
          {
            id: "IN-01",

    const storyMap = new Map();
    pages.forEach(page => (page.items || []).forEach(item => storyMap.set(item.id, item)));

    const defaultState = () => {
      const decisions = {};
      storyMap.forEach(item => {
        decisions[item.id] = {
          status: item.consensus ? "accept" : "pending",
          feedback: ""
        };
      });
      return {
        schemaVersion: 1,
        currentPage: 0,
        decisions,
        savedAt: null,
        exportedAt: null
      };
    };

    function normalizeState(candidate) {
      const base = defaultState();
      if (!candidate || typeof candidate !== "object") return base;
      for (const id of storyMap.keys()) {
        const incoming = candidate.decisions && candidate.decisions[id];
        if (!incoming) continue;
        if (STATUS_LABELS[incoming.status]) base.decisions[id].status = incoming.status;
        if (typeof incoming.feedback === "string") base.decisions[id].feedback = incoming.feedback;
      }
      if (Number.isInteger(candidate.currentPage)) {
        base.currentPage = Math.max(0, Math.min(candidate.currentPage, pages.length - 1));
      }
      base.savedAt = candidate.savedAt || null;
      base.exportedAt = candidate.exportedAt || null;
      return base;
    }

    function loadState() {
      if (window.__LLL_ALIGNMENT_SEED__) {
        return normalizeState(window.__LLL_ALIGNMENT_SEED__);
      }
      try {
        return normalizeState(JSON.parse(localStorage.getItem(STORAGE_KEY)));
      } catch (_) {
        return defaultState();
      }
    }

    let state = loadState();
    let search = "";
    let statusFilter = "all";
    let toastTimer = null;

    const deck = document.querySelector("#deck");
    const pageNav = document.querySelector("#pageNav");
    const toolbarTitle = document.querySelector("#toolbarTitle");
    const toolbarDesc = document.querySelector("#toolbarDesc");
    const prevBtn = document.querySelector("#prevBtn");
    const nextBtn = document.querySelector("#nextBtn");
    const searchInput = document.querySelector("#searchInput");
    const statusFilterInput = document.querySelector("#statusFilter");
    const importFile = document.querySelector("#importFile");
    const toast = document.querySelector("#toast");

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function saveState() {
      state.savedAt = new Date().toISOString();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      updateSummary();
      if (pages[state.currentPage].package) renderPackage();
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function actionsTable(actions) {
      if (!actions || !actions.length) return "";
      return `
        <h4>按钮 / 动作合同</h4>
        <table class="action-table">
          <thead><tr><th>动作</th><th>系统行为</th><th>完成语义</th></tr></thead>
          <tbody>
            ${actions.map(row => `<tr>${row.map(cell => `<td>${escapeHtml(cell)}</td>`).join("")}</tr>`).join("")}
          </tbody>
        </table>
      `;
    }

    function itemSearchText(item) {
      return [
        item.id,
        item.title,
        item.summary,
        item.story,
        ...(item.acceptance || []),
        ...(item.data || []),
        ...((item.actions || []).flat()),
        item.source
      ].join(" ").toLowerCase();
    }

    function storyCard(item) {
      const decision = state.decisions[item.id];
      return `
        <article class="story-card" data-story-id="${item.id}" data-status="${decision.status}">
          <div class="story-top">
            <span class="story-id">${item.id}</span>
            ${item.consensus ? '<span class="consensus">用户已明确认可</span>' : ""}
          </div>
          <h3>${escapeHtml(item.title)}</h3>
          <p class="story-summary">${escapeHtml(item.summary)}</p>
          <p class="story-statement"><strong>用户故事：</strong>${escapeHtml(item.story)}</p>
          <details class="detail">
            <summary>展开验收、数据与按钮合同</summary>
            <h4>验收标准</h4>
            <ul>${(item.acceptance || []).map(row => `<li>${escapeHtml(row)}</li>`).join("")}</ul>
            ${item.data && item.data.length ? `<h4>数据 / 文件落点</h4><ul>${item.data.map(row => `<li><code>${escapeHtml(row)}</code></li>`).join("")}</ul>` : ""}
            ${actionsTable(item.actions)}
            <div class="source">来源：${escapeHtml(item.source || "本轮产品整理")}</div>
          </details>
          <div class="decision">
            <div class="status-row" role="radiogroup" aria-label="${escapeHtml(item.title)} 的对齐状态">
              ${Object.entries(STATUS_LABELS).map(([value, label]) => `
                <label>
                  <input type="radio" name="status-${item.id}" value="${value}" ${decision.status === value ? "checked" : ""}>
                  ${label}
                </label>
              `).join("")}
            </div>
            <textarea class="feedback" data-feedback-id="${item.id}" placeholder="写下修改意见、边界、例外或验收补充...">${escapeHtml(decision.feedback)}</textarea>
          </div>
        </article>
      `;
    }

    function renderNav() {
      pageNav.innerHTML = pages.map((page, index) => `
        <button class="page-link ${index === state.currentPage ? "active" : ""}" data-page="${index}">
          <small>Page ${String(index + 1).padStart(2, "0")}</small>
          <strong>${escapeHtml(page.short)}</strong>
          <span>${escapeHtml(page.title)}</span>
        </button>
      `).join("");
    }

    function renderDeck() {
      deck.innerHTML = pages.map((page, index) => `
        <article class="page ${index === state.currentPage ? "active" : ""}" data-page-id="${page.id}">
          <header class="page-head">
            <div>
              <p class="eyebrow">${escapeHtml(page.short)}</p>
              <h2>${escapeHtml(page.title)}</h2>
              <p>${escapeHtml(page.desc)}</p>
            </div>
            <div class="page-number"><small>Page</small><strong>${String(index + 1).padStart(2, "0")}</strong></div>
          </header>
          ${page.callout ? `<div class="callout">${escapeHtml(page.callout)}</div>` : ""}
          ${page.package
            ? `<div class="package">
                <textarea id="packageText" readonly></textarea>
                <div class="package-actions">
                  <button class="btn primary" id="copyPackageBtn">复制 AI 补充包</button>
                  <button class="btn" id="downloadPackageBtn">下载 Markdown</button>
                  <button class="btn rust" id="packageExportHtmlBtn">下载已对齐 HTML</button>
                </div>
              </div>`
            : `<div class="story-grid" data-story-grid="${page.id}">${(page.items || []).map(storyCard).join("")}</div>`
          }
        </article>
      `).join("");
      renderPackage();
      applyFilters();
    }

    function renderPage(index) {
      state.currentPage = Math.max(0, Math.min(index, pages.length - 1));
      document.querySelectorAll(".page").forEach((page, i) => page.classList.toggle("active", i === state.currentPage));
      document.querySelectorAll(".page-link").forEach((link, i) => link.classList.toggle("active", i === state.currentPage));
      const page = pages[state.currentPage];
      toolbarTitle.textContent = `${String(state.currentPage + 1).padStart(2, "0")} · ${page.title}`;
      toolbarDesc.textContent = page.desc;
      prevBtn.disabled = state.currentPage === 0;
      nextBtn.disabled = state.currentPage === pages.length - 1;
      saveState();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function updateSummary() {
      const decisions = Object.values(state.decisions);
      const accepted = decisions.filter(item => item.status === "accept").length;
      const reviewed = decisions.filter(item => item.status !== "pending").length;
      const feedback = decisions.filter(item => item.feedback.trim()).length;
      document.querySelector("#acceptedCount").textContent = accepted;
      document.querySelector("#reviewedCount").textContent = reviewed;
      document.querySelector("#feedbackCount").textContent = feedback;
      document.querySelector("#totalCount").textContent = decisions.length;
      document.querySelector("#progressBar").style.width = `${Math.round(reviewed / decisions.length * 100)}%`;
    }

    function applyFilters() {
      document.querySelectorAll(".story-card").forEach(card => {
        const item = storyMap.get(card.dataset.storyId);
        const decision = state.decisions[item.id];
        const matchesStatus = statusFilter === "all" || decision.status === statusFilter;
        const matchesSearch = !search || itemSearchText(item).includes(search);
        card.hidden = !(matchesStatus && matchesSearch);
      });
      document.querySelectorAll("[data-story-grid]").forEach(grid => {
        let empty = grid.querySelector(".empty");
        const visible = [...grid.querySelectorAll(".story-card")].some(card => !card.hidden);
        if (!visible && !empty) {
          empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "当前页没有符合筛选条件的故事。";
          grid.append(empty);
        }
        if (empty) empty.hidden = visible;
      });
    }

    function buildPackage() {
      const included = [];
      pages.forEach(page => {
        const items = (page.items || []).filter(item => ["accept", "revise"].includes(state.decisions[item.id].status));
        if (items.length) included.push({ page, items });
      });
      const lines = [
        "# LLL 五智能体产品补充包",
        "",
        `生成时间：${new Date().toISOString()}`,
        "",
        "读取规则：",
        "- 只把“认同”项视为已确认需求。",
        "- “需修改”项必须结合对应反馈改写后，再进入正式文档。",
        "- “待决定”和“不采用”项不得偷偷进入实现范围。",
        "- 当前 iteration-02 范围不因本包自动扩大；请新建后续 iteration 合同。",
        ""
      ];
      included.forEach(({ page, items }) => {
        lines.push(`## ${page.title}`, "");
        items.forEach(item => {
          const decision = state.decisions[item.id];
          lines.push(`### ${item.id} ${item.title}`);
          lines.push(`状态：${STATUS_LABELS[decision.status]}`);
          lines.push(`用户故事：${item.story}`);
          lines.push("验收标准：");
          (item.acceptance || []).forEach(row => lines.push(`- ${row}`));
          if (item.data && item.data.length) {
            lines.push("数据 / 文件落点：");
            item.data.forEach(row => lines.push(`- ${row}`));
          }
          if (decision.feedback.trim()) {
            lines.push(`用户反馈：${decision.feedback.trim()}`);
          }
          lines.push("");
        });
      });
      return lines.join("\n");
    }

    function renderPackage() {
      const area = document.querySelector("#packageText");
      if (area) area.value = buildPackage();
    }

    function download(name, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = name;
      document.body.append(anchor);
      anchor.click();
      anchor.remove();
      URL.revokeObjectURL(url);
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const helper = document.createElement("textarea");
      helper.value = text;
      helper.setAttribute("readonly", "");
      helper.style.position = "fixed";
      helper.style.opacity = "0";
      document.body.append(helper);
      helper.select();
      const copied = document.execCommand("copy");
      helper.remove();
      if (!copied) throw new Error("copy command was rejected");
    }

    function exportJson() {
      const payload = {
        ...state,
        exportedAt: new Date().toISOString(),
        document: "LEARNING_AGENTS_USER_STORY_ALIGNMENT.html"
      };
      download("lll-learning-agents-alignment.json", JSON.stringify(payload, null, 2), "application/json;charset=utf-8");
      showToast("JSON 对齐结果已下载");
    }

    function exportHtml() {
      const exportState = {
        ...state,
        exportedAt: new Date().toISOString()
      };
      const serialized = JSON.stringify(exportState).replaceAll("<", "\\u003c");
      const clone = document.documentElement.cloneNode(true);
      const seed = clone.querySelector("#alignment-seed");
      seed.textContent = `window.__LLL_ALIGNMENT_SEED__ = ${serialized};`;
      const exported = "<!doctype html>\n" + clone.outerHTML;
      download("LLL_五智能体_已对齐结果.html", exported, "text/html;charset=utf-8");
      showToast("已下载包含选择结果的独立 HTML");
    }

    pageNav.addEventListener("click", event => {
      const button = event.target.closest("[data-page]");
      if (button) renderPage(Number(button.dataset.page));
    });

    deck.addEventListener("change", event => {
      const radio = event.target.closest('input[type="radio"][name^="status-"]');
      if (!radio) return;
      const id = radio.name.replace("status-", "");
      state.decisions[id].status = radio.value;
      const card = radio.closest(".story-card");
      card.dataset.status = radio.value;
      saveState();
      applyFilters();
    });

    deck.addEventListener("input", event => {
      const area = event.target.closest("[data-feedback-id]");
      if (!area) return;
      state.decisions[area.dataset.feedbackId].feedback = area.value;
      saveState();
    });

    deck.addEventListener("click", async event => {
      if (event.target.closest("#copyPackageBtn")) {
        try {
          await copyText(buildPackage());
          showToast("AI 补充包已复制");
        } catch (_) {
          const area = document.querySelector("#packageText");
          if (area) {
            area.focus();
            area.select();
          }
          showToast("复制失败，请在文本框中全选复制");
        }
      }
      if (event.target.closest("#downloadPackageBtn")) {
        download("LLL_五智能体_AI补充包.md", buildPackage(), "text/markdown;charset=utf-8");
        showToast("Markdown 补充包已下载");
      }
      if (event.target.closest("#packageExportHtmlBtn")) exportHtml();
    });

    searchInput.addEventListener("input", () => {
      search = searchInput.value.trim().toLowerCase();
      applyFilters();
    });

    statusFilterInput.addEventListener("change", () => {
      statusFilter = statusFilterInput.value;
      applyFilters();
    });

    prevBtn.addEventListener("click", () => renderPage(state.currentPage - 1));
    nextBtn.addEventListener("click", () => renderPage(state.currentPage + 1));
    document.querySelector("#jumpPackageBtn").addEventListener("click", () => renderPage(pages.findIndex(page => page.package)));
    document.querySelector("#exportHtmlBtn").addEventListener("click", exportHtml);
    document.querySelector("#exportJsonBtn").addEventListener("click", exportJson);
    document.querySelector("#importBtn").addEventListener("click", () => importFile.click());

    importFile.addEventListener("change", async () => {
      const [file] = importFile.files;
      if (!file) return;
      try {
        state = normalizeState(JSON.parse(await file.text()));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        renderNav();
        renderDeck();
        updateSummary();
        renderPage(state.currentPage);
        showToast("对齐结果已导入");
      } catch (_) {
        showToast("导入失败：不是有效的对齐 JSON");
      } finally {
        importFile.value = "";
      }
    });

    document.querySelector("#resetBtn").addEventListener("click", () => {
      if (!confirm("恢复初始状态会清除当前选择和反馈，继续吗？")) return;
      state = defaultState();
      localStorage.removeItem(STORAGE_KEY);
      renderNav();
      renderDeck();
      updateSummary();
      renderPage(0);
      showToast("已恢复初始共识");
    });

    document.addEventListener("keydown", event => {
      const editing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
      if (editing) return;
      if (event.key === "ArrowLeft") renderPage(state.currentPage - 1);
      if (event.key === "ArrowRight") renderPage(state.currentPage + 1);
    });

    renderNav();
    renderDeck();
    updateSummary();
    renderPage(state.currentPage);
  </script>
</body>
</html>
