<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目 — LifeLongLearn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:wght@700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="topbar">
  <a href="/index.html" class="topbar-logo">Life<span class="accent">Long</span>Learn</a>
  <div class="topbar-sep"></div>
  <div class="topbar-nav">
    <a href="/index.html">总览</a>
    <a href="/project.html" class="active">项目</a>
    <a href="/agents.html">智能体</a>
    <a href="/memory.html">记忆</a>
  </div>
  <div class="topbar-right">
    <span id="connectionState">● 连接中</span>
    <span id="workspaceLabel" style="font-family:'JetBrains Mono',monospace;font-size:.68rem"></span>
  </div>
</div>

<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-head">
      <span>项目浏览器</span>
      <button id="new-project-btn" class="btn-tiny" title="新建项目">+</button>
    </div>
    <div class="sidebar-scroll" id="project-tree">
      <div class="tree-empty">加载中…</div>
    </div>
    <div class="zone-timeline-wrap">
      <div class="tree-section">学习阶段</div>
      <div class="zone-timeline" id="zone-timeline"></div>
    </div>
    <div class="sidebar-foot">
      <div class="tree-section">活跃会话</div>
      <div id="active-sessions" class="muted-mini">无</div>
    </div>
  </aside>

  <main class="main main-wide">
    <div class="main-scroll">
      <div class="project-head">
        <div>
          <h1 id="project-title">未选择项目</h1>
          <p id="project-meta" class="muted">从左侧选择一个项目，或创建新项目</p>
        </div>
        <div class="project-actions">
          <!-- zone-select kept for state sync, hidden since sidebar timeline drives UI -->
          <select id="zone-select" style="display:none">
            <option value="Intro">引入</option>
            <option value="Explain" selected>讲解</option>
            <option value="Practice">练习</option>
            <option value="Extend">拓展</option>
            <option value="Summary">总结</option>
          </select>
        </div>
      </div>

      <div class="card reading-card">
        <div class="card-head">
          <div>
            <span class="zone-name" id="zone-name">Explain</span>
            <span class="badge badge-blue" id="zone-status">空</span>
          </div>
          <div>
            <button id="invoke-btn" class="btn btn-primary">调用讲解智能体</button>
          </div>
        </div>
        <div class="invoke-row">
          <textarea id="invoke-intent" placeholder="学习意图：例如「用 200 字解释 Rust 所有权」"></textarea>
        </div>
        <div id="zone-output" class="content">
          <div class="empty">尚未生成输出。点击上方按钮开始学习。</div>
        </div>
      </div>

      <div class="card sub-card">
        <div class="card-row">
          <div class="card-body">
            <h4>前置阶段</h4>
            <p id="predecessors" class="muted">无前置阶段</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="terminal-drawer" id="terminal-drawer">
    <div class="terminal-drawer-bar">
      <div>
        <strong>🖥 终端</strong>
        <span class="session-meta" id="session-meta">无活跃会话</span>
        <span class="badge badge-blue" id="session-state-badge">空闲</span>
      </div>
      <div>
        <button id="drawer-close" class="btn-tiny">收起</button>
      </div>
    </div>
    <div class="terminal-drawer-body">
      <div class="terminal-stream" id="terminal-stream">
        <div class="empty">点击「调用讲解智能体」开始会话。终端输出会在这里实时显示。</div>
      </div>
      <div class="terminal-sidebar">
        <h5>会话信息</h5>
        <div class="info-row"><span class="info-label">智能体</span><span class="info-value" id="info-agent">—</span></div>
        <div class="info-row"><span class="info-label">阶段</span><span class="info-value" id="info-zone">—</span></div>
        <div class="info-row"><span class="info-label">状态</span><span class="info-value" id="info-state">—</span></div>
        <div class="info-row"><span class="info-label">轮次</span><span class="info-value" id="info-turns">0</span></div>
        <h5>追问</h5>
        <textarea id="followup-input" placeholder="输入追问后回车…"></textarea>
        <button id="followup-send" class="btn btn-primary btn-sm">发送追问</button>
        <button id="cancel-session" class="btn btn-outline btn-sm" style="color:var(--pink);border-color:var(--pink)">取消会话</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="/js/app-project.js"></script>
</body>
</html>
