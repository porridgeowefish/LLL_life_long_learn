<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能体 — LifeLongLearn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:wght@700;900&family=JetBrains+Mono:wght@400;500&family=Lora:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<style>
  .agent-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:8px}
  .agent-card-mini{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);transition:all .2s;cursor:pointer}
  .agent-card-mini:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(61,50,41,.08)}
  .agent-card-mini.active{border-color:var(--accent);background:rgba(124,154,114,.04)}
  .agent-card-mini .mini-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .agent-card-mini .mini-head .ico{color:var(--accent);font-size:1rem}
  .agent-card-mini h4{font-size:.88rem;font-weight:700;flex:1}
  .agent-card-mini p{font-size:.72rem;color:var(--muted);line-height:1.5;margin:0}
  .agent-card-mini .zones{margin-top:8px;display:flex;gap:4px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="topbar">
  <a href="/index.html" class="topbar-logo">Life<span class="accent">Long</span>Learn</a>
  <div class="topbar-sep"></div>
  <div class="topbar-nav">
    <a href="/index.html">总览</a>
    <a href="/project.html">项目</a>
    <a href="/agents.html" class="active">智能体</a>
    <a href="/memory.html">记忆</a>
  </div>
  <div class="topbar-right">
    <span id="connectionState">连接中</span>
  </div>
</div>

<svg style="display:none">
  <symbol id="ico-bot" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="12" y1="4" x2="12" y2="8" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="4" r="1.2" fill="currentColor"/><circle cx="9" cy="13" r="1" fill="currentColor"/><circle cx="15" cy="13" r="1" fill="currentColor"/></symbol>
  <symbol id="ico-brain" viewBox="0 0 24 24"><path d="M9 4 a3 3 0 0 0 -3 3 v1 a3 3 0 0 0 -2 3 v1 a3 3 0 0 0 2 3 v1 a3 3 0 0 0 3 3 h1 V4 z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M15 4 a3 3 0 0 1 3 3 v1 a3 3 0 0 1 2 3 v1 a3 3 0 0 1 -2 3 v1 a3 3 0 0 1 -3 3 h-1 V4 z" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
  <symbol id="ico-zap" viewBox="0 0 24 24"><polygon points="13 3 5 14 11 14 10 21 19 9 13 9 14 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
</svg>

<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-head"><span>导航</span></div>
    <div class="sidebar-scroll">
      <div class="tree-section">快捷入口</div>
      <a href="/index.html" class="tree-item"><span class="icon"><svg class="ico"><use href="#ico-zap"/></svg></span>学习总览</a>
      <a href="/agents.html" class="tree-item active"><span class="icon"><svg class="ico"><use href="#ico-bot"/></svg></span>智能体管理</a>
      <a href="/memory.html" class="tree-item"><span class="icon"><svg class="ico"><use href="#ico-brain"/></svg></span>记忆系统</a>

      <div class="tree-section">智能体分类</div>
      <div id="agent-categories"></div>
    </div>
  </aside>

  <main class="main main-wide">
    <div class="main-scroll">
      <div class="page-header">
        <h1>智能体注册表</h1>
        <p>每个智能体都有明确的角色、章程和阶段兼容性。点击卡片查看详情。</p>
      </div>

      <h2 class="h-section">已注册智能体</h2>
      <div class="agent-grid" id="agents-grid"></div>

      <h2 class="h-section">详情</h2>
      <div id="agent-detail-host"></div>
    </div>
  </main>
</div>

<script type="module">
import { listAgents, getHealth } from './js/api.js';

const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
let agentsCache = [];

async function init() {
  try {
    const h = await getHealth();
    $('connectionState').textContent = h.claude && h.claude.available ? '在线' : 'Claude 未就绪';
    $('connectionState').style.color = h.claude && h.claude.available ? 'var(--accent)' : 'var(--orange)';
  } catch {}
  const { agents } = await listAgents();
  agentsCache = agents;
  renderSidebarCats(agents);
  renderGrid(agents);
  if (agents.length) showAgent(agents[0]);
}

function renderSidebarCats(agents) {
  const c = $('agent-categories');
  const byZone = {};
  for (const a of agents) {
    for (const z of (a.allowedZones || [])) {
      byZone[z] = byZone[z] || [];
      byZone[z].push(a);
    }
  }
  c.innerHTML = Object.entries(byZone).map(([zone, list]) => `
    <div class="tree-item" style="cursor:default">
      <span class="icon"><svg class="ico"><use href="#ico-bot"/></svg></span>
      <span style="flex:1">${zone}</span>
      <span class="tag">${list.length}</span>
    </div>
  `).join('') || `<div class="muted-mini">暂无</div>`;
}

function renderGrid(agents) {
  const c = $('agents-grid');
  if (!agents.length) {
    c.innerHTML = `<div class="empty" style="grid-column:1/-1">尚未注册任何智能体。</div>`;
    return;
  }
  c.innerHTML = agents.map(a => `
    <div class="agent-card-mini" data-id="${a.id}">
      <div class="mini-head"><svg class="ico"><use href="#ico-bot"/></svg><h4>${esc(a.name)}</h4></div>
      <p>${esc(a.description || '—')}</p>
      <div class="zones">${(a.allowedZones||[]).map(z => `<span class="tag">${z}</span>`).join('')}</div>
    </div>
  `).join('');
  c.querySelectorAll('.agent-card-mini').forEach(el => {
    el.addEventListener('click', () => {
      const a = agentsCache.find(x => x.id === el.dataset.id);
      if (a) showAgent(a);
    });
  });
}

async function showAgent(a) {
  document.querySelectorAll('.agent-card-mini').forEach(el => {
    el.classList.toggle('active', el.dataset.id === a.id);
  });
  let charter = '(无法加载章程)';
  if (a.charterPath) {
    try {
      const r = await fetch(`/${a.charterPath}`);
      if (r.ok) charter = await r.text();
    } catch {}
  }
  const targets = (a.defaultOutputTargets || []).map(t => `${t.zoneName}/${t.filename}`).join(', ') || '—';
  $('agent-detail-host').innerHTML = `
    <div class="agent-detail">
      <h3>${esc(a.name)}</h3>
      <p class="muted">${esc(a.description || '—')}</p>
      <div class="detail-section">
        <h5>允许阶段</h5>
        <p>${(a.allowedZones||[]).map(z => `<span class="tag">${z}</span>`).join(' ')}</p>
      </div>
      <div class="detail-section">
        <h5>章程</h5>
        <pre style="white-space:pre-wrap;background:#2a2018;color:#e8e2d9;padding:14px 18px;border-radius:6px;font-size:.78rem;line-height:1.6;overflow-x:auto">${esc(charter)}</pre>
      </div>
      <div class="detail-section">
        <h5>默认输出目标</h5>
        <p>${esc(targets)}</p>
      </div>
    </div>
  `;
}

init();
</script>
</body>
</html>
